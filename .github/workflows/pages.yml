name: CI and Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep this identical to the version used for local verification.
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install deps
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # CI runners are UTC. The app targets Nepal (UTC+05:45), so run the
      # main suite in CI time and the calendar tests in Nepal time.
      - name: Test (UTC)
        run: flutter test --reporter expanded
        env:
          TZ: UTC

      - name: Test calendar conversions (Nepal time)
        run: flutter test test/bs_picker_test.dart test/widget/bs_picker_test.dart
        env:
          TZ: Asia/Kathmandu

      - name: Build web for Pages
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *".github.io" ]]; then BASE="/"; else BASE="/$REPO/"; fi
          echo "Base href: $BASE"
          ARGS="--release --base-href=$BASE --no-wasm-dry-run"
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then ARGS="$ARGS --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}"; fi
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then ARGS="$ARGS --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"; fi
          # shellcheck disable=SC2086
          flutter build web $ARGS
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    # Pull requests only run the checks above; never deploy them.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
