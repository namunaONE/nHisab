<!DOCTYPE html>
<html>
<head>
  <!--
    GitHub Pages SPA fallback for Flutter Web.
    This is a source template. CI overwrites the deployed copy with the
    built index.html on every deploy (see .github/workflows/pages.yml:
    cp build/web/index.html build/web/404.html), so routing always matches.
    Keep <base href> as placeholder; flutter build --base-href replaces it.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="nHisab - Loan Records & Interest Calculator for Nepal.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="nhisab">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>nhisab</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
